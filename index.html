<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 24px 16px;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h2 { margin-top: 0; font-size: 20px; }
    label { display: block; font-size: 13px; color: #666; margin: 16px 0 6px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #06C755;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #aaa; }
    #status { margin-top: 12px; font-size: 13px; color: #999; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>ลงทะเบียนสมาชิก</h2>

    <label>เบอร์โทรศัพท์</label>
    <input id="phone" type="tel" placeholder="0812345678">

    <label>วันเกิด</label>
    <input id="birthday" type="date">

    <button id="submitBtn" onclick="submitForm()">ลงทะเบียน</button>
    <div id="status"></div>
  </div>

  <script>
    function submitForm() {
      const phone = document.getElementById('phone').value.trim();
      const birthday = document.getElementById('birthday').value;
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');

      if (!phone || !birthday) {
        status.textContent = 'กรุณากรอกข้อมูลให้ครบ';
        return;
      }

      btn.disabled = true;
      status.textContent = 'กำลังบันทึกข้อมูล...';

      google.script.run
        .withSuccessHandler(function (result) {
          status.textContent = 'สำเร็จ! กำลังพากลับไปที่แชท LINE...';
          // พาไปที่แชท LINE OA พร้อมข้อความยืนยัน (trigger webhook + replyToken)
          window.top.location.href = result.oaLink;
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          status.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
        })
        .submitRegistration(phone, birthday);
    }
  </script>
</body>
</html>

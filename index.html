<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทดสอบ Flex Message</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0f2f3a 0%, #1a5f6e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        h1 {
            color: #0b3b4b;
            margin-bottom: 10px;
        }
        p {
            color: #4b6a74;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1f7a8c, #0e4d5e);
            color: white;
            box-shadow: 0 8px 20px rgba(31, 122, 140, 0.35);
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(31, 122, 140, 0.5);
        }
        .btn-success {
            background: linear-gradient(135deg, #2d8f6f, #1a6b4f);
            color: white;
            box-shadow: 0 8px 20px rgba(45, 143, 111, 0.35);
        }
        .btn-success:hover {
            transform: scale(1.02);
        }
        .btn-danger {
            background: linear-gradient(135deg, #c6363c, #8f262a);
            color: white;
            box-shadow: 0 8px 20px rgba(198, 54, 60, 0.35);
        }
        .btn-danger:hover {
            transform: scale(1.02);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 15px;
            background: #f5f8fa;
            color: #0b3b4b;
            font-size: 0.95rem;
            min-height: 60px;
            display: none;
        }
        .result-box.show {
            display: block;
        }
        .result-box.success {
            background: #e1f3f0;
            border-left: 4px solid #1f7a8c;
        }
        .result-box.error {
            background: #fee8e8;
            border-left: 4px solid #c6363c;
        }
        input {
            width: 100%;
            padding: 12px 18px;
            margin: 8px 0;
            border: 2px solid #dce8ec;
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #1f7a8c;
            box-shadow: 0 0 0 5px rgba(31, 122, 140, 0.12);
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            font-weight: 600;
            color: #1c4f5e;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 4px;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background: #eef6f8;
            color: #1f7a8c;
            margin-bottom: 15px;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #8aa8b2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📨 ทดสอบ Flex Message</h1>
        <p>กดปุ่มเพื่อส่ง Flex Message ไปยัง LINE OA</p>
        
        <div class="badge">
            <i class="fas fa-info-circle"></i> ต้องมี replyToken ก่อน
        </div>

        <!-- ช่องใส่ replyToken -->
        <div class="input-group">
            <label><i class="fas fa-key"></i> Reply Token</label>
            <input type="text" id="replyTokenInput" placeholder="ใส่ replyToken ที่ได้จาก LINE Webhook">
        </div>

        <!-- ช่องใส่ userId -->
        <div class="input-group">
            <label><i class="fas fa-user"></i> User ID</label>
            <input type="text" id="userIdInput" placeholder="ใส่ userId (ไม่บังคับ)">
        </div>

        <!-- ปุ่มกด -->
        <button class="btn btn-primary" id="sendFlexBtn">
            <i class="fas fa-paper-plane"></i> ส่ง Flex Message
        </button>

        <button class="btn btn-success" id="sendSuccessBtn">
            <i class="fas fa-check-circle"></i> ส่ง Flex ยืนยันการลงทะเบียน
        </button>

        <button class="btn btn-danger" id="testWebhookBtn">
            <i class="fas fa-bolt"></i> ทดสอบ Webhook
        </button>

        <!-- ผลลัพธ์ -->
        <div id="resultBox" class="result-box">
            <span id="resultText">รอผลการทำงาน...</span>
        </div>

        <div class="footer">
            <i class="fas fa-shield-alt"></i> ระบบจะตอบกลับผ่าน Reply API (ฟรี)
        </div>
    </div>

    <script>
        // ============================================================
        //  URL ของ Web App
        // ============================================================
        const API_URL = "https://script.google.com/macros/s/AKfycbwJW1B4Vp9lzLo-MQxl2MoK22h8Xo0KHQbYtbgUnBaDsYPxDtgRQzOAzubQcl4Vnkd0/exec";

        // ============================================================
        //  DOM References
        // ============================================================
        const replyTokenInput = document.getElementById("replyTokenInput");
        const userIdInput = document.getElementById("userIdInput");
        const sendFlexBtn = document.getElementById("sendFlexBtn");
        const sendSuccessBtn = document.getElementById("sendSuccessBtn");
        const testWebhookBtn = document.getElementById("testWebhookBtn");
        const resultBox = document.getElementById("resultBox");
        const resultText = document.getElementById("resultText");

        // ============================================================
        //  Helper: แสดงผล
        // ============================================================
        function showResult(message, isSuccess = true) {
            resultBox.className = "result-box show " + (isSuccess ? "success" : "error");
            resultText.textContent = message;
        }

        function hideResult() {
            resultBox.className = "result-box";
        }

        // ============================================================
        //  ปุ่ม: ส่ง Flex Message
        // ============================================================
        sendFlexBtn.addEventListener("click", function() {
            const replyToken = replyTokenInput.value.trim();
            const userId = userIdInput.value.trim() || "unknown";

            if (!replyToken) {
                showResult("❌ กรุณาใส่ replyToken ก่อน", false);
                return;
            }

            hideResult();
            sendFlexBtn.disabled = true;
            sendFlexBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังส่ง...';

            const url = API_URL + "?action=sendFlex&replyToken=" + encodeURIComponent(replyToken) + 
                        "&userId=" + encodeURIComponent(userId);

            fetch(url)
                .then(res => res.text())
                .then(text => {
                    try {
                        const data = JSON.parse(text);
                        showResult(data.message, data.success);
                    } catch (e) {
                        showResult("📬 Response: " + text, true);
                    }
                })
                .catch(err => {
                    showResult("❌ เกิดข้อผิดพลาด: " + err.message, false);
                })
                .finally(() => {
                    sendFlexBtn.disabled = false;
                    sendFlexBtn.innerHTML = '<i class="fas fa-paper-plane"></i> ส่ง Flex Message';
                });
        });

        // ============================================================
        //  ปุ่ม: ส่ง Flex ยืนยันการลงทะเบียน
        // ============================================================
        sendSuccessBtn.addEventListener("click", function() {
            const replyToken = replyTokenInput.value.trim();

            if (!replyToken) {
                showResult("❌ กรุณาใส่ replyToken ก่อน", false);
                return;
            }

            hideResult();
            sendSuccessBtn.disabled = true;
            sendSuccessBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังส่ง...';

            // ข้อมูลตัวอย่าง
            const userData = {
                firstname: "สมชาย",
                lastname: "ใจดี",
                email: "somchai@example.com",
                phone: "081-234-5678",
                gender: "ชาย"
            };

            const url = API_URL + "?action=sendSuccess&replyToken=" + encodeURIComponent(replyToken) +
                        "&firstname=" + encodeURIComponent(userData.firstname) +
                        "&lastname=" + encodeURIComponent(userData.lastname) +
                        "&email=" + encodeURIComponent(userData.email) +
                        "&phone=" + encodeURIComponent(userData.phone) +
                        "&gender=" + encodeURIComponent(userData.gender);

            fetch(url)
                .then(res => res.text())
                .then(text => {
                    try {
                        const data = JSON.parse(text);
                        showResult(data.message, data.success);
                    } catch (e) {
                        showResult("📬 Response: " + text, true);
                    }
                })
                .catch(err => {
                    showResult("❌ เกิดข้อผิดพลาด: " + err.message, false);
                })
                .finally(() => {
                    sendSuccessBtn.disabled = false;
                    sendSuccessBtn.innerHTML = '<i class="fas fa-check-circle"></i> ส่ง Flex ยืนยันการลงทะเบียน';
                });
        });

        // ============================================================
        //  ปุ่ม: ทดสอบ Webhook (จำลอง LINE Webhook)
        // ============================================================
        testWebhookBtn.addEventListener("click", function() {
            const replyToken = replyTokenInput.value.trim();

            if (!replyToken) {
                showResult("❌ กรุณาใส่ replyToken ก่อน", false);
                return;
            }

            hideResult();
            testWebhookBtn.disabled = true;
            testWebhookBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังทดสอบ...';

            // จำลองข้อมูลที่ LINE ส่งมา
            const mockData = {
                events: [{
                    type: "message",
                    replyToken: replyToken,
                    source: {
                        userId: userIdInput.value.trim() || "U_TEST_USER"
                    },
                    message: {
                        type: "text",
                        text: "ทดสอบ Flex Message"
                    }
                }]
            };

            // ส่งไปยัง Webhook โดยตรง (POST)
            fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(mockData)
            })
            .then(res => res.text())
            .then(text => {
                showResult("📬 Webhook Response: " + text, true);
            })
            .catch(err => {
                showResult("❌ เกิดข้อผิดพลาด: " + err.message, false);
            })
            .finally(() => {
                testWebhookBtn.disabled = false;
                testWebhookBtn.innerHTML = '<i class="fas fa-bolt"></i> ทดสอบ Webhook';
            });
        });

        // ============================================================
        //  โหลดหน้า: แนะนำการใช้งาน
        // ============================================================
        window.addEventListener("DOMContentLoaded", function() {
            showResult("💡 ใส่ replyToken ที่ได้จาก LINE Webhook แล้วกดปุ่มทดสอบ", true);
        });
    </script>
</body>
</html>

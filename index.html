<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนสมาชิก</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0f2f3a 0%, #1a5f6e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 35px;
            padding: 45px 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header .icon-circle {
            background: linear-gradient(135deg, #06C755, #05a344);
            width: 75px; height: 75px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px;
        }
        .header .icon-circle i { font-size: 35px; color: white; }
        .header h1 { font-size: 1.8rem; color: #0b3b4b; }
        .header p { color: #4b6a74; margin-top: 5px; }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-weight: 600; color: #1c4f5e; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 13px 18px 13px 45px;
            font-size: 1rem; border: 2px solid #dce8ec;
            border-radius: 30px; background: #f8fbfc;
            outline: none; color: #0c3b48;
        }
        .form-group .input-icon {
            position: absolute; left: 18px; top: 42px;
            color: #6f8f9a; font-size: 1.1rem;
        }
        .btn {
            width: 100%; padding: 15px;
            border: none; border-radius: 50px;
            font-size: 1.05rem; font-weight: 700;
            cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 12px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #06C755, #05a344);
            color: white;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg-box {
            padding: 14px 20px; border-radius: 30px;
            margin-top: 18px; display: none;
            align-items: center; gap: 14px;
            font-weight: 500; border-left: 5px solid;
        }
        .msg-box.show { display: flex; }
        .msg-box.error { background: #fee8e8; color: #a13030; border-color: #c6363c; }
        .msg-box.success { background: #e1f3f0; color: #0b4b4b; border-color: #06C755; }
        .msg-box i { font-size: 1.6rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon-circle">
                <i class="fab fa-line"></i>
            </div>
            <h1>ลงทะเบียนสมาชิก</h1>
            <p>กรอกข้อมูลเพื่อสมัครสมาชิกและเชื่อมต่อ LINE</p>
        </div>

        <form id="myForm" novalidate>
            <div class="form-group">
                <label for="phone"><i class="fas fa-phone-alt"></i> เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" placeholder="0812345678" maxlength="10" required>
                <i class="fas fa-phone-alt input-icon"></i>
            </div>

            <div class="form-group">
                <label for="birthday"><i class="fas fa-birthday-cake"></i> วันเกิด</label>
                <input type="date" id="birthday" required>
                <i class="fas fa-birthday-cake input-icon"></i>
            </div>

            <div id="formError" class="msg-box error">
                <i class="fas fa-exclamation-circle"></i>
                <span id="formErrorText"></span>
            </div>

            <button type="submit" class="btn btn-primary" id="sub">
                <i class="fab fa-line"></i> ลงทะเบียนและเชื่อมต่อ LINE
            </button>
        </form>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwJW1B4Vp9lzLo-MQxl2MoK22h8Xo0KHQbYtbgUnBaDsYPxDtgRQzOAzubQcl4Vnkd0/exec";

        document.getElementById("myForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            const phone = document.getElementById("phone").value.trim();
            const birthday = document.getElementById("birthday").value;
            
            if (!phone || phone.length < 10) {
                showError('กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง');
                return;
            }
            
            if (!birthday) {
                showError('กรุณาเลือกวันเกิด');
                return;
            }
            
            const btn = document.getElementById("sub");
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังดำเนินการ...';
            
            // ส่งข้อมูลไป GAS เพื่อลงทะเบียนและรับ URL สำหรับ LINE Login
            const fd = new FormData();
            fd.append('action', 'registerAndGetLineLoginUrl');
            fd.append('phone', phone);
            fd.append('birthday', birthday);
            
            fetch(WEB_APP_URL, { method: 'POST', body: fd })
                .then(res => res.text())
                .then(text => {
                    const res = JSON.parse(text);
                    
                    if (res.status === 'ok' && res.lineLoginUrl) {
                        // Redirect ไปยัง LINE Login
                        window.location.href = res.lineLoginUrl;
                    } else {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fab fa-line"></i> ลงทะเบียนและเชื่อมต่อ LINE';
                        showError(res.error || 'เกิดข้อผิดพลาด');
                    }
                })
                .catch(err => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fab fa-line"></i> ลงทะเบียนและเชื่อมต่อ LINE';
                    showError('เกิดข้อผิดพลาด: ' + err.message);
                });
        });
        
        function showError(text) {
            const errorBox = document.getElementById("formError");
            errorBox.className = 'msg-box show error';
            document.getElementById("formErrorText").textContent = text;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 24px 16px;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h2 { margin-top: 0; font-size: 20px; }
    label { display: block; font-size: 13px; color: #666; margin: 16px 0 6px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #06C755;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #aaa; }
    #status { margin-top: 12px; font-size: 13px; color: #999; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>ลงทะเบียนสมาชิก</h2>

    <label>เบอร์โทรศัพท์</label>
    <input id="phone" type="tel" placeholder="0812345678">

    <label>วันเกิด</label>
    <input id="birthday" type="date">

    <button id="submitBtn" onclick="submitForm()">ลงทะเบียน</button>
    <div id="status"></div>
  </div>

  <script>
    // ★ แก้ตรงนี้ ★ ใส่ URL ของ Web App ที่ Deploy จาก Apps Script (ลงท้ายด้วย /exec)
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwJW1B4Vp9lzLo-MQxl2MoK22h8Xo0KHQbYtbgUnBaDsYPxDtgRQzOAzubQcl4Vnkd0/exec';

    function submitForm() {
      const phone = document.getElementById('phone').value.trim();
      const birthday = document.getElementById('birthday').value;
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');

      if (!phone || !birthday) {
        status.textContent = 'กรุณากรอกข้อมูลให้ครบ';
        return;
      }

      btn.disabled = true;
      status.textContent = 'กำลังบันทึกข้อมูล...';

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        // ใช้ text/plain เพื่อเลี่ยง CORS preflight (GAS Web App ไม่รองรับ OPTIONS)
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'register', phone: phone, birthday: birthday })
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (result.status !== 'ok') {
            throw new Error('บันทึกข้อมูลไม่สำเร็จ');
          }
          status.textContent = 'สำเร็จ! กำลังพากลับไปที่แชท LINE...';
          // พาไปที่แชท LINE OA พร้อมข้อความยืนยัน (trigger webhook + replyToken)
          window.location.href = result.oaLink;
        })
        .catch(function (err) {
          btn.disabled = false;
          status.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
        });
    }
  </script>
</body>
</html>

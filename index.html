<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 24px 16px;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h2 { margin-top: 0; font-size: 20px; }
    label { display: block; font-size: 13px; color: #666; margin: 16px 0 6px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #06C755;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #333; }
    button:disabled { background: #aaa; }
    #status { margin-top: 12px; font-size: 13px; color: #999; text-align: center; }
    #linkStep { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
    #linkStep h3 { font-size: 15px; margin: 0 0 8px; }
    #linkStep p { font-size: 13px; color: #666; line-height: 1.5; margin: 0 0 4px; }
    #fallback { display: none; margin-top: 16px; padding: 16px; background: #f0f0f0; border-radius: 10px; }
    #fallback p { font-size: 13px; color: #555; margin: 0 0 8px; }
    #fallbackMessage { font-weight: 600; font-size: 15px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>ลงทะเบียนสมาชิก</h2>

    <div id="registerForm">
      <label>เบอร์โทรศัพท์</label>
      <input id="phone" type="tel" placeholder="0812345678">

      <label>วันเกิด</label>
      <input id="birthday" type="date">

      <button id="submitBtn">ลงทะเบียน</button>
    </div>

    <div id="status"></div>

    <!-- ขั้นที่ 2: ปรากฏหลังลงทะเบียนสำเร็จ -->
    <div id="linkStep">
      <h3>ขั้นตอนถัดไป</h3>
      <p>กดปุ่มด้านล่างเพื่อยืนยันผูกบัญชีสมาชิกกับ LINE ของคุณ</p>
      <button id="linkBtn">ยืนยันผูกบัญชีสมาชิก LINE</button>
    </div>

    <!-- แสดงเมื่อ auto-fill ข้อความใน LINE ไม่ทำงาน (เช่น LINE Desktop App) -->
    <div id="fallback">
      <p>ถ้าเปิด LINE แล้วห้องแชทว่าง ไม่มีข้อความ ให้กดคัดลอกข้อความนี้แล้ววางส่งในแชทเอง:</p>
      <div id="fallbackMessage"></div>
      <button id="copyBtn" class="secondary">คัดลอกข้อความ</button>
    </div>
  </div>

  <script>
    // ★ แก้ตรงนี้ ★ ใส่ URL ของ Web App ที่ Deploy จาก Apps Script (ลงท้ายด้วย /exec)
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX/exec';

    let regToken = '';
    let pendingMessage = '';

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function copyMessage() {
      navigator.clipboard.writeText(pendingMessage).then(function () {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'คัดลอกแล้ว ✓';
        setTimeout(function () { btn.textContent = 'คัดลอกข้อความ'; }, 2000);
      });
    }

    function showChatStep(oaLink, message) {
      pendingMessage = message;
      document.getElementById('fallbackMessage').textContent = message;
      document.getElementById('fallback').style.display = 'block';
      window.location.href = oaLink;
    }

    // ขั้นที่ 1: ลงทะเบียน
    function submitForm() {
      const phone = document.getElementById('phone').value.trim();
      const birthday = document.getElementById('birthday').value;
      const btn = document.getElementById('submitBtn');

      if (!phone || !birthday) {
        setStatus('กรุณากรอกข้อมูลให้ครบ');
        return;
      }

      btn.disabled = true;
      setStatus('กำลังบันทึกข้อมูล...');

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        // ใช้ text/plain เพื่อเลี่ยง CORS preflight (GAS Web App ไม่รองรับ OPTIONS)
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'register', phone: phone, birthday: birthday })
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (result.status !== 'ok') throw new Error('บันทึกข้อมูลไม่สำเร็จ');

          regToken = result.token;
          document.getElementById('registerForm').style.display = 'none';
          document.getElementById('linkStep').style.display = 'block';
          setStatus('บันทึกข้อมูลสำเร็จ กรุณากดปุ่มด้านล่างเพื่อยืนยันผูกบัญชี');
        })
        .catch(function (err) {
          btn.disabled = false;
          setStatus('เกิดข้อผิดพลาด: ' + err.message);
        });
    }

    // ขั้นที่ 2: ยืนยันผูกบัญชี LINE
    // - ถ้ายังไม่เคยแชทกับ OA มาก่อน -> เด้งไปแชทก่อน (ตั้งค่า userId ในระบบ)
    // - ถ้าแชทแล้ว -> ออก linkToken จริง แล้วเด้งไปหน้าจอผูกบัญชีของ LINE
    function requestLink() {
      const btn = document.getElementById('linkBtn');
      btn.disabled = true;
      setStatus('กำลังออก linkToken และสร้างการผูกบัญชี...');

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'requestLink', token: regToken })
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          btn.disabled = false;

          if (result.status === 'needChat') {
            setStatus('กรุณายืนยันตัวตนในแชท LINE ก่อน แล้วค่อยกลับมากดปุ่มนี้อีกครั้ง');
            showChatStep(result.oaLink, result.message);
            return;
          }

          if (result.status === 'ok') {
            setStatus('กำลังเปิดหน้าต่างผูกบัญชีกับ LINE...');
            window.location.href = result.accountLinkUrl;
            return;
          }

          if (result.status === 'notfound') {
            setStatus('ไม่พบข้อมูลการลงทะเบียน กรุณาลงทะเบียนใหม่');
            return;
          }

          setStatus(result.error || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
        })
        .catch(function (err) {
          btn.disabled = false;
          setStatus('เกิดข้อผิดพลาด: ' + err.message);
        });
    }

    document.getElementById('submitBtn').addEventListener('click', submitForm);
    document.getElementById('linkBtn').addEventListener('click', requestLink);
    document.getElementById('copyBtn').addEventListener('click', copyMessage);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ทดสอบเชื่อมต่อ GAS Web App</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #111; color: #0f0; }
    button { padding: 12px 20px; font-size: 16px; margin-bottom: 20px; }
    pre { background: #000; padding: 16px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
    .error { color: #f55; }
    .ok { color: #5f5; }
  </style>
</head>
<body>
  <h2>ทดสอบเชื่อมต่อ GAS Web App</h2>
  <p>แก้ URL ด้านล่างในโค้ดให้ตรงกับของคุณ แล้วกดปุ่มทดสอบ ผลจะโชว์ตรงนี้แบบละเอียด ไม่ต้องเดา</p>
  <button id="testBtn">เริ่มทดสอบ</button>
  <pre id="log">รอกดปุ่ม...</pre>

  <script>
    // ★ แก้ตรงนี้ให้ตรงกับ URL จริงของคุณ ★
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwJW1B4Vp9lzLo-MQxl2MoK22h8Xo0KHQbYtbgUnBaDsYPxDtgRQzOAzubQcl4Vnkd0/exec';

    const log = document.getElementById('log');
    function write(text, cls) {
      const span = document.createElement('div');
      if (cls) span.className = cls;
      span.textContent = text;
      log.appendChild(span);
    }

    document.getElementById('testBtn').addEventListener('click', async function () {
      log.innerHTML = '';
      write('URL ที่หน้านี้ถูกเปิดอยู่ตอนนี้ (origin): ' + window.location.origin);
      write('กำลังยิง GET ไปที่ /exec ก่อน (ไม่ต้อง login) ...');

      // ทดสอบที่ 1: GET แบบธรรมดา ดูว่าเจอหน้า login ของ Google ไหม
      try {
        const getRes = await fetch(GAS_WEB_APP_URL, { method: 'GET', redirect: 'follow' });
        write('GET status: ' + getRes.status + ' | ok: ' + getRes.ok + ' | url สุดท้ายหลัง redirect: ' + getRes.url);
        const text = await getRes.text();
        if (text.includes('accounts.google.com') || text.includes('ServiceLogin')) {
          write('⚠️ พบว่าโดน redirect ไปหน้า login ของ Google → Who has access ไม่ได้ตั้งเป็น "Anyone" จริง แก้ที่ Deploy settings', 'error');
        } else if (text.includes('<!DOCTYPE') || text.includes('ลงทะเบียน')) {
          write('✅ GET เจอหน้าฟอร์มปกติ ไม่ติด login แสดงว่า deployment settings ถูกแล้ว', 'ok');
        } else {
          write('เนื้อหาที่ได้กลับมา (200 ตัวอักษรแรก): ' + text.slice(0, 200));
        }
      } catch (err) {
        write('❌ GET fetch พังตั้งแต่ต้น: ' + err.message, 'error');
        write('ถ้า error ตรงนี้คือ "Failed to fetch" และหน้านี้เปิดผ่าน file:// → ต้นเหตุคือ origin null ตามที่บอกไว้ก่อนหน้า', 'error');
      }

      write('---');
      write('กำลังยิง POST (แบบเดียวกับตอนลงทะเบียนจริง) ...');

      // ทดสอบที่ 2: POST จริงแบบเดียวกับ submitForm
      try {
        const postRes = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'register', phone: '0800000000', birthday: '2000-01-01' })
        });
        write('POST status: ' + postRes.status + ' | ok: ' + postRes.ok + ' | type: ' + postRes.type);
        const postText = await postRes.text();
        write('POST response body: ' + postText);
        if (postRes.ok) {
          write('✅ POST สำเร็จจริง เชื่อมต่อได้ปกติแล้ว! (มีการเพิ่มแถวทดสอบเบอร์ 0800000000 ลง Sheet ไปแล้ว ลบทิ้งได้เลย)', 'ok');
        }
      } catch (err) {
        write('❌ POST fetch พัง: ' + err.name + ' — ' + err.message, 'error');
        write('ชนิด error นี้ ("TypeError: Failed to fetch") แปลว่าเบราว์เซอร์บล็อกตั้งแต่ระดับ network/CORS ก่อนจะได้รับ response กลับมาเลย ตัว error message ของ browser จะไม่บอกสาเหตุตรงๆ (เป็นข้อจำกัดด้าน security ของ fetch API) — ให้ดูผลจากทดสอบที่ 1 (GET) ด้านบนประกอบ ถ้า GET เจอหน้า login แปลว่าสาเหตุเดียวกันนี้ทำให้ POST พังด้วย', 'error');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนสมาชิก</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0f2f3a 0%, #1a5f6e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-radius: 35px;
            padding: 45px 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-3px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .icon-circle {
            background: linear-gradient(135deg, #1f7a8c, #0e4d5e);
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 10px 25px rgba(31, 122, 140, 0.4);
        }

        .header .icon-circle i {
            font-size: 35px;
            color: white;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0b3b4b;
            letter-spacing: 0.5px;
        }

        .header p {
            color: #4b6a74;
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .header .divider {
            height: 3px;
            background: linear-gradient(to right, transparent, #1f7a8c, transparent);
            width: 80px;
            margin: 12px auto 0;
            border-radius: 5px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #1c4f5e;
            font-size: 0.92rem;
            margin-bottom: 6px;
        }

        .form-group label i {
            margin-right: 8px;
            color: #1f7a8c;
            width: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 18px 13px 45px;
            font-size: 1rem;
            border: 2px solid #dce8ec;
            border-radius: 30px;
            background: #f8fbfc;
            transition: all 0.3s ease;
            outline: none;
            color: #0c3b48;
        }

        .form-group input:focus {
            border-color: #1f7a8c;
            background: #ffffff;
            box-shadow: 0 0 0 5px rgba(31, 122, 140, 0.12);
        }

        .form-group .input-icon {
            position: absolute;
            left: 18px;
            top: 42px;
            color: #6f8f9a;
            font-size: 1.1rem;
            transition: 0.3s;
            pointer-events: none;
        }

        .form-group input:focus~.input-icon {
            color: #1f7a8c;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1f7a8c, #0e4d5e);
            color: white;
            box-shadow: 0 8px 20px rgba(31, 122, 140, 0.35);
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #2596ab, #0f5a6b);
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(31, 122, 140, 0.5);
        }

        .btn-line {
            background: #06C755;
            color: white;
            box-shadow: 0 8px 20px rgba(6, 199, 85, 0.3);
        }

        .btn-line:hover {
            background: #05b34c;
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(6, 199, 85, 0.45);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #1f7a8c;
            color: #1f7a8c;
        }

        .btn-outline:hover {
            background: #1f7a8c;
            color: white;
            box-shadow: 0 6px 18px rgba(31, 122, 140, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .msg-box {
            padding: 14px 20px;
            border-radius: 30px;
            margin-top: 18px;
            display: none;
            align-items: center;
            gap: 14px;
            font-weight: 500;
            border-left: 5px solid;
        }

        .msg-box.show {
            display: flex;
        }

        .msg-box.success {
            background: #e1f3f0;
            color: #0b4b4b;
            border-color: #1f7a8c;
        }

        .msg-box.success i {
            color: #1f7a8c;
            font-size: 1.6rem;
        }

        .msg-box.error {
            background: #fee8e8;
            color: #a13030;
            border-color: #c6363c;
        }

        .msg-box.error i {
            color: #c6363c;
            font-size: 1.6rem;
        }

        .msg-box.warning {
            background: #fdf3e3;
            color: #8a5a00;
            border-color: #e6a817;
        }

        .msg-box.warning i {
            color: #e6a817;
            font-size: 1.6rem;
        }

        .msg-box.loading {
            background: #eef6f8;
            color: #1c4f5e;
            border-color: #1f7a8c;
        }

        .msg-box.loading i {
            color: #1f7a8c;
            font-size: 1.6rem;
        }

        .card {
            display: none;
        }

        .card.show {
            display: block;
        }

        .token-box {
            background: #f0f6f8;
            border: 2px dashed #9fc2cc;
            border-radius: 16px;
            padding: 14px 18px;
            margin: 14px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .token-box .token {
            font-size: 1.3rem;
            font-weight: 800;
            color: #0b3b4b;
            letter-spacing: 2px;
            font-family: Consolas, monospace;
            word-break: break-all;
        }

        .token-box .copy-btn {
            flex-shrink: 0;
            background: #1f7a8c;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .token-box .copy-btn:hover {
            background: #0e4d5e;
        }

        .step-hint {
            background: #eef6f8;
            border-radius: 16px;
            padding: 14px 18px;
            margin: 14px 0;
            color: #1c4f5e;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .step-hint code {
            display: block;
            background: #0b3b4b;
            color: #7fe0c0;
            padding: 8px 14px;
            border-radius: 10px;
            margin-top: 8px;
            font-size: 0.95rem;
            word-break: break-all;
        }

        .divider {
            text-align: center;
            color: #8aa8b2;
            font-size: 0.8rem;
            margin: 18px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #dce8ec;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 0.8rem;
            color: #8aa8b2;
        }

        .footer i {
            color: #1f7a8c;
        }

        @media (max-width: 550px) {
            .container {
                padding: 28px 18px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .form-group input {
                padding-left: 40px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="icon-circle">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1>ลงทะเบียนสมาชิก</h1>
            <p>กรอกข้อมูลเพื่อสมัครสมาชิกและผูกบัญชี LINE</p>
            <div class="divider"></div>
        </div>

        <!-- ขั้นตอนที่ 1: กรอกข้อมูลลงทะเบียน -->
        <div id="step1" class="card show">
            <form id="myForm" novalidate>
                <div class="form-group">
                    <label for="phone"><i class="fas fa-phone-alt"></i> เบอร์โทรศัพท์</label>
                    <input type="tel" id="phone" name="phone" placeholder="081-234-5678" required>
                    <i class="fas fa-phone-alt input-icon"></i>
                </div>

                <div class="form-group">
                    <label for="birthday"><i class="fas fa-birthday-cake"></i> วันเกิด</label>
                    <input type="date" id="birthday" name="birthday" required>
                    <i class="fas fa-birthday-cake input-icon"></i>
                </div>

                <button type="submit" class="btn btn-primary" id="sub">
                    <i class="fas fa-paper-plane"></i> ลงทะเบียน
                </button>
            </form>
        </div>

        <!-- ขั้นตอนที่ 2: ยืนยันผ่าน LINE + ผูกบัญชี -->
        <div id="step2" class="card">
            <div class="msg-box show success">
                <i class="fas fa-check-circle"></i>
                <span id="step2Title">ลงทะเบียนสำเร็จ!</span>
            </div>

            <div class="step-hint">
                <b>รหัสยืนยันของคุณ:</b>
                <div class="token-box">
                    <span class="token" id="tokenDisplay">-</span>
                    <button type="button" class="copy-btn" id="copyBtn" onclick="copyToken()">
                        <i class="fas fa-copy"></i> คัดลอก
                    </button>
                </div>
                <div>เปิดแชทกับ LINE OA แล้วส่งข้อความนี้ เพื่อยืนยันตัวตน:</div>
                <code id="confirmMessage">ยืนยันสมาชิก XXXXXXXX</code>
            </div>

            <a href="#" id="btnOpenChat" target="_blank" rel="noopener" class="btn btn-line">
                <i class="fab fa-line"></i> เปิดแชทกับ LINE OA
            </a>

            <div class="divider">ขั้นตอนต่อไป</div>

            <button type="button" id="btnLink" class="btn btn-outline" onclick="requestLinkAccount()">
                <i class="fas fa-link"></i> ยืนยันผูกบัญชีสมาชิก LINE
            </button>

            <div id="linkMsg" class="msg-box">
                <i id="linkMsgIcon" class="fas fa-info-circle"></i>
                <span id="linkMsgText"></span>
            </div>
        </div>

        <div class="footer">
            <i class="fas fa-shield-alt"></i> ข้อมูลของคุณจะถูกเก็บเป็นความลับ
        </div>
    </div>

    <script>
        // ============================================================
        //  ตั้งค่า: ใส่ URL ของ Web App (เฉพาะกรณีโฮสต์ฟอร์มไว้นอก Google Apps Script)
        //  ถ้าฟอร์มถูก serve จาก doGet ของโปรเจกต์นี้เอง ไม่ต้องใส่ (ใช้ google.script.run)
        // ============================================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwJW1B4Vp9lzLo-MQxl2MoK22h8Xo0KHQbYtbgUnBaDsYPxDtgRQzOAzubQcl4Vnkd0/exec"; // เช่น "https://script.google.com/macros/s/XXXX/exec"

        let regToken = '';
        let regOaLink = '';
        let regMessage = '';

        const form = document.getElementById("myForm");
        const subBtn = document.getElementById("sub");
        const step1 = document.getElementById("step1");
        const step2 = document.getElementById("step2");
        const linkMsg = document.getElementById("linkMsg");
        const linkMsgIcon = document.getElementById("linkMsgIcon");
        const linkMsgText = document.getElementById("linkMsgText");
        const linkBtn = document.getElementById("btnLink");

        // ============================================================
        //  เรียกฟังก์ชันฝั่งเซิร์ฟเวอร์: google.script.run (หน้า serve จาก GAS)
        //  หรือ JSONP ผ่าน WEB_APP_URL (กรณีโฮสต์ฟอร์มที่อื่น)
        // ============================================================
        function callServer(method, args, onSuccess, onFailure) {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(onSuccess)
                    .withFailureHandler(function (err) {
                        onFailure(new Error(String(err)));
                    })[method].apply(null, args);
                return;
            }

            if (WEB_APP_URL) {
                const action = (method === 'clientRegister') ? 'register' : 'requestLink';
                const cbName = '__jsonp_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
                const params = { action: action, callback: cbName };
                if (method === 'clientRegister') {
                    params.phone = args[0];
                    params.birthday = args[1];
                } else {
                    params.token = args[0];
                }
                const qs = Object.keys(params)
                    .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); })
                    .join('&');
                const script = document.createElement('script');
                const cleanup = function () { delete window[cbName]; script.remove(); };
                window[cbName] = function (data) { cleanup(); onSuccess(data); };
                script.src = WEB_APP_URL + '?' + qs;
                script.onerror = function () { cleanup(); onFailure(new Error('ไม่สามารถติดต่อเซิร์ฟเวอร์ได้')); };
                document.head.appendChild(script);
                return;
            }

            onFailure(new Error('ต้องรันบน Google Apps Script หรือตั้งค่า WEB_APP_URL'));
        }

        // ============================================================
        //  ขั้นตอนที่ 1: ลงทะเบียน (เบอร์โทร + วันเกิด)
        // ============================================================
        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const phone = document.getElementById("phone").value.trim();
            const birthday = document.getElementById("birthday").value;

            if (!phone) {
                showLinkStatus('error', 'กรุณากรอกเบอร์โทรศัพท์');
                return;
            }
            if (!birthday) {
                showLinkStatus('error', 'กรุณาเลือกวันเกิด');
                return;
            }

            subBtn.disabled = true;
            subBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังบันทึก...';

            callServer('clientRegister', [phone, birthday],
                function (res) {
                    subBtn.disabled = false;
                    subBtn.innerHTML = '<i class="fas fa-paper-plane"></i> ลงทะเบียน';

                    if (res && res.status === 'ok') {
                        regToken = res.token || '';
                        regOaLink = res.oaLink || '';
                        regMessage = res.message || ('ยืนยันสมาชิก ' + regToken);

                        document.getElementById("tokenDisplay").textContent = regToken;
                        document.getElementById("confirmMessage").textContent = regMessage;
                        document.getElementById("btnOpenChat").href = regOaLink;

                        hideLinkStatus();
                        step1.classList.remove('show');
                        step2.classList.add('show');
                    } else {
                        showLinkStatus('error', (res && res.error) ? res.error : 'ลงทะเบียนไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
                    }
                },
                function (err) {
                    subBtn.disabled = false;
                    subBtn.innerHTML = '<i class="fas fa-paper-plane"></i> ลงทะเบียน';
                    showLinkStatus('error', err.message);
                });
        });

        // ============================================================
        //  ขั้นตอนที่ 2: ขอผูกบัญชี LINE อย่างเป็นทางการ (Account Link)
        // ============================================================
        function requestLinkAccount() {
            if (!regToken) {
                showLinkStatus('error', 'กรุณาลงทะเบียนก่อน');
                return;
            }

            linkBtn.disabled = true;
            linkBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังขอสิทธิ์ผูกบัญชี...';

            callServer('clientRequestLink', [regToken],
                function (res) {
                    linkBtn.disabled = false;
                    linkBtn.innerHTML = '<i class="fas fa-link"></i> ยืนยันผูกบัญชีสมาชิก LINE';

                    if (!res) {
                        showLinkStatus('error', 'เซิร์ฟเวอร์ไม่ตอบสนอง กรุณาลองอีกครั้ง');
                        return;
                    }

                    if (res.status === 'ok' && res.accountLinkUrl) {
                        // ไปหน้าผูกบัญชีของ LINE (ผู้ใช้กดยืนยัน/ปฏิเสธใน LINE)
                        window.location.href = res.accountLinkUrl;
                    } else if (res.status === 'needChat') {
                        // ยังไม่เคยแชทกับ OA → ต้องไปส่งข้อความยืนยันก่อน
                        if (res.oaLink) {
                            regOaLink = res.oaLink;
                            document.getElementById("btnOpenChat").href = res.oaLink;
                        }
                        showLinkStatus('warning',
                            'ยังไม่พบการยืนยันจาก LINE กรุณากด "เปิดแชทกับ LINE OA" แล้วส่งข้อความยืนยันให้เรียบร้อย จากนั้นกดปุ่มนี้อีกครั้ง');
                    } else if (res.status === 'notfound') {
                        showLinkStatus('error', 'ไม่พบข้อมูลการลงทะเบียนนี้ในระบบ');
                    } else if (res.status === 'error') {
                        showLinkStatus('error', res.error || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
                    } else {
                        showLinkStatus('error', 'ผลลัพธ์ไม่ถูกต้องจากเซิร์ฟเวอร์');
                    }
                },
                function (err) {
                    linkBtn.disabled = false;
                    linkBtn.innerHTML = '<i class="fas fa-link"></i> ยืนยันผูกบัญชีสมาชิก LINE';
                    showLinkStatus('error', err.message);
                });
        }

        // ============================================================
        //  Helper
        // ============================================================
        function copyToken() {
            const token = regToken || document.getElementById("tokenDisplay").textContent;
            if (!token) return;

            function done() {
                const btn = document.getElementById("copyBtn");
                const old = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> คัดลอกแล้ว';
                setTimeout(function () { btn.innerHTML = old; }, 1500);
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(token).then(done).catch(function () {
                    fallbackCopy(token);
                    done();
                });
            } else {
                fallbackCopy(token);
                done();
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (e) { }
            ta.remove();
        }

        function showLinkStatus(type, text) {
            linkMsg.className = 'msg-box show ' + type;
            if (type === 'error') {
                linkMsgIcon.className = 'fas fa-exclamation-circle';
            } else if (type === 'warning') {
                linkMsgIcon.className = 'fas fa-exclamation-triangle';
            } else {
                linkMsgIcon.className = 'fas fa-info-circle';
            }
            linkMsgText.textContent = text;
        }

        function hideLinkStatus() {
            linkMsg.className = 'msg-box';
            linkMsgText.textContent = '';
        }
    </script>
</body>

</html>

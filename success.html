<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เชื่อมต่อสำเร็จ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .card {
            max-width: 380px;
            width: 100%;
            text-align: center;
        }

        /* แถวโลโก้: LINE — ไอคอนเชื่อมต่อ — โลโก้ของระบบเรา */
        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            margin-bottom: 34px;
        }

        .logo-circle {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .logo-circle.line {
            background: #06c755;
        }

        .logo-circle.line svg {
            width: 34px;
            height: 34px;
            fill: #ffffff;
        }

        .logo-circle.brand {
            background: #f2f2f2;
        }

        /* 👇 ถ้ามีโลโก้จริงเป็นไฟล์ภาพ ให้แทน <span> ด้านล่างด้วย <img src="logo.png"> */
        .logo-circle.brand span {
            font-weight: 800;
            font-size: 1rem;
            color: #333;
            letter-spacing: 0.5px;
        }

        .link-icon {
            width: 20px;
            height: 20px;
            color: #b5b5b5;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        h1 .brand-name {
            color: #06c755;
        }

        p.subtext {
            font-size: 0.85rem;
            color: #8b8b8b;
            line-height: 1.6;
        }

        .footer-links {
            margin-top: 60px;
            display: flex;
            justify-content: center;
            gap: 18px;
            font-size: 0.75rem;
            color: #b0b0b0;
        }

        .footer-links a {
            color: #b0b0b0;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="logo-row">
            <div class="logo-circle line">
                <!-- LINE speech-bubble icon -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2C6.48 2 2 5.85 2 10.6c0 4.24 3.53 7.79 8.31 8.47.32.07.76.21.87.49.1.25.06.65.03.9l-.14.86c-.04.25-.2.99.86.54 1.06-.45 5.73-3.37 7.82-5.77C21.24 13.99 22 12.38 22 10.6 22 5.85 17.52 2 12 2z" />
                </svg>
            </div>

            <!-- ไอคอนเชื่อมต่อ (chain link) -->
            <svg class="link-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M9 15l6-6" />
                <path d="M11 5l1-1a3.5 3.5 0 015 5l-1 1" />
                <path d="M13 19l-1 1a3.5 3.5 0 01-5-5l1-1" />
            </svg>

            <!-- โลโก้ LINE OA: โหลดจาก backend ตามบอทที่ใช้อยู่ (ไม่ฮาร์ดโค้ด)
                 ระหว่างโหลด/โหลดไม่ได้ → แสดง placeholder "LINE" -->
            <div class="logo-circle brand">
                <img id="oaLogo" src="" alt="โลโก้ LINE OA"
                    style="display:none; width:100%; height:100%; object-fit:cover;"
                    onerror="showLogoFallback();">
                <span id="oaLogoFallback" style="display:flex;">LINE</span>
            </div>
        </div>

        <h1>ตอนนี้ LINE เชื่อมต่อกับ<br><span class="brand-name" id="oaName">LINE OA</span> แล้ว</h1>
        <p class="subtext">ท่านสามารถรับข่าวสารและบริการต่างๆ<br>ผ่านบัญชีที่ผูกไว้ได้ในตอนนี้</p>
        <p class="subtext" style="margin-top:8px; color:#06c755;">💬 พิมพ์ข้อความในแชท LINE เพื่อรับบัตรสมาชิกของคุณ</p>

        <div class="footer-links">
            <a href="#">ข้อตกลงการใช้บริการ</a>
            <a href="#">นโยบายความเป็นส่วนตัว</a>
        </div>
    </div>

    <script>
        // ============================================================
        //  ดึงชื่อ + โลโก้ LINE OA จาก Google Apps Script (AccessToken ใน backend)
        //  1) เปิดผ่าน GAS (?page=success) → ใช้ google.script.run
        //  2) เปิดแบบ static (netlify)      → ใช้ fetch ผ่าน CORS (GAS ตอบ ACAO: *)
        //  โหลดไม่ได้/ยังไม่โหลด → แสดง placeholder "LINE" (ไม่มีค่าบอทฝังใน HTML)
        // ============================================================
        const API_URL = "https://script.google.com/macros/s/AKfycbwJW1B4Vp9lzLo-MQxl2MoK22h8Xo0KHQbYtbgUnBaDsYPxDtgRQzOAzubQcl4Vnkd0/exec"; // 👈 เปลี่ยนเป็น URL Web App ที่ deploy จริง

        function showLogoFallback() {
            const img = document.getElementById("oaLogo");
            const fb = document.getElementById("oaLogoFallback");
            if (img) img.style.display = "none";
            if (fb) fb.style.display = "flex";
        }

        function showLogo(profile) {
            const img = document.getElementById("oaLogo");
            const fb = document.getElementById("oaLogoFallback");
            if (img && profile && profile.pictureUrl) {
                img.onerror = showLogoFallback;
                img.src = profile.pictureUrl;
                img.style.display = "block";
                if (fb) fb.style.display = "none";
            }
        }

        function applyProfile(profile) {
            if (!profile) return;
            const name = document.getElementById("oaName");
            if (name && profile.displayName) {
                name.textContent = profile.displayName;
            }
            showLogo(profile);
        }

        function loadOaProfile() {
            // เปิดผ่าน GAS → เรียก backend โดยตรง
            if (typeof google !== "undefined" && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(applyProfile)
                    .withFailureHandler(function () { /* ใช้ค่าใน HTML */ })
                    .getBotProfile();
                return;
            }
            // เปิดแบบ static → fetch ผ่าน CORS
            fetch(API_URL + "?getProfile=1")
                .then(function (r) { return r.json(); })
                .then(applyProfile)
                .catch(function () { /* ใช้ค่าใน HTML */ });
        }

        window.addEventListener("DOMContentLoaded", loadOaProfile);
    </script>

</body>

</html>
